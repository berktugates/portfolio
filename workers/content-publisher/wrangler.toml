name = "berktug-content-publisher"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "portfolio-content"

[[d1_databases]]
binding = "META"
database_name = "content-meta"
database_id = "acb84bb8-b10b-417c-a81e-269e8d70b7cb"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["7,22,37,52 * * * *", "0 */2 * * *", "15 4 * * *", "0 9 * * *"]

[[send_email]]
name = "ALERT_EMAIL"
allowed_destination_addresses = ["berktugates@gmail.com", "contact@berktugberke.com"]

[vars]
REVALIDATE_URL = "https://berktugberke.com/api/revalidate"
HABERLER_HOST = "haberler.berktugberke.com"
NEWS_AUTO_PUBLISH = "true"
PUBLICATION_LEGAL_READY = "true"
GROWTHDAILY_DAILY_PUBLISH_CAP = "1"
CONTACT_FROM_EMAIL = "newsroom@berktugberke.com"
CONTACT_INBOUND_EMAIL = "berktugates@gmail.com"
GITHUB_REPOSITORY = "berktugates/portfolio"

# wrangler secret put REVALIDATE_SECRET
# wrangler secret put GITHUB_DISPATCH_TOKEN  # repo dispatch → blog-post-publish.yml
# wrangler secret put INDEXNOW_KEY
