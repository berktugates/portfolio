name: Publish gundem briefing

on:
  schedule:
    # 07:00 UTC — blog haftalık batch’ten ayrı saat (plan Faz 4 G.4)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gundem
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate queues and gundem leak guard
        run: |
          set -euo pipefail
          pnpm check:queues
          node scripts/assert-no-gundem-links.mjs

      - name: Safety + publish to Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BLOB_PUBLIC_BASE_URL: ${{ secrets.BLOB_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/publish-gundem.ts
