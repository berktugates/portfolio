# Ulusal gündem brifingleri (tüm Türkiye; yalnızca bilişim değil). docs/gundem-editorial.md
name: Publish gundem briefing

# Zamanlı yayın: Cloudflare Worker `berktug-content-publisher` (cron 04:00 UTC ≈ 07:00 TR).
on:
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: Mevcut gundem-queue dosyasını Trends yenilemeden yayınla
        type: boolean
        default: false
      catalog_slug:
        description: skip_refresh ile content/gundem-catalog/<slug>.json kuyruğa alınır
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-gundem
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate queues and gundem leak guard
        run: |
          set -euo pipefail
          pnpm check:queues
          node scripts/assert-no-gundem-links.mjs

      - name: Trends + GSC demand → queue
        if: inputs.skip_refresh != true
        env:
          CONTENT_PUBLIC_BASE_URL: ${{ secrets.CONTENT_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/refresh-gundem-queue.ts

      - name: Catalog → queue (manuel brifing)
        if: inputs.skip_refresh == true && inputs.catalog_slug != ''
        run: |
          set -euo pipefail
          slug="${{ inputs.catalog_slug }}"
          src="content/gundem-catalog/${slug}.json"
          test -f "$src"
          mkdir -p content/gundem-queue
          rm -f content/gundem-queue/*.json
          cp "$src" "content/gundem-queue/$(date -u +%F)-${slug}.json"

      - name: Safety + publish to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CONTENT_PUBLIC_BASE_URL: ${{ secrets.CONTENT_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/publish-gundem.ts

      - name: Prod smoke (haberler host)
        run: pnpm exec node --import tsx scripts/gundem-smoke-prod.ts

      - name: Measurement surface (GTM / sitemap / GSC baseline)
        run: pnpm check:measurement
