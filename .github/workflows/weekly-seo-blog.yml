name: Blog queue → R2 sync

# Git kuyruk (content/blog-queue) → R2 queue/blog/. Yayın: Worker cron 30 5 * * * UTC (GDS’ten bağımsız, deploy yok).
on:
  schedule:
    - cron: "15 4 * * *"
  push:
    branches: [main]
    paths:
      - "content/blog-queue/**"
  workflow_dispatch:

concurrency:
  group: blog-queue-r2-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync queue JSON to R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate blog queue
        run: |
          set -euo pipefail
          pnpm check:queues
          COUNT=$(find content/blog-queue -maxdepth 1 -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "Queued posts: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::warning::Blog queue empty"
            exit 0
          fi

      - name: Upload queue to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: pnpm exec tsx scripts/sync-blog-queue-r2.ts
