# İlk / idempotent Blob seed — ulusal gündem örnekleri (content/gundem-seed.json). docs/gundem-editorial.md
name: Seed gundem Blob (Faz 4)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-gundem-blob
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed editorial briefings to Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BLOB_PUBLIC_BASE_URL: ${{ secrets.BLOB_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/seed-gundem-blob.ts

      - name: Verify Blob index (Faz 4 DoD)
        env:
          BLOB_PUBLIC_BASE_URL: ${{ secrets.BLOB_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/verify-gundem-blob.ts
