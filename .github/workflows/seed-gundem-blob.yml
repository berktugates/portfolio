# İlk / idempotent R2 seed — ulusal gündem örnekleri (content/gundem-seed.json). docs/gundem-editorial.md
name: Seed gundem R2 (Faz 4)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-gundem-blob
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed editorial briefings to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CONTENT_PUBLIC_BASE_URL: ${{ secrets.CONTENT_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/seed-gundem-r2.ts

      - name: Verify R2 index (Faz 4 DoD)
        env:
          CONTENT_PUBLIC_BASE_URL: ${{ secrets.CONTENT_PUBLIC_BASE_URL }}
        run: pnpm exec node --import tsx scripts/verify-gundem-r2.ts
